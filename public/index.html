<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>日日家｜一起生活的空間</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app"><aside><div class="brand"><span>日</span><div><strong>日日家</strong><small>一起生活的空間</small></div></div><div class="space">🏡 <span>我們的家<small>本機體驗空間</small></span></div><nav id="nav"></nav><div class="aside-bottom">✦ &nbsp;把平凡的日子，<br>　 過成喜歡的樣子。</div></aside><main><header><div><div class="eyebrow">FAMILY LIFE HUB</div><h1 id="title"></h1><p id="subtitle"></p></div><button class="primary" id="add">＋ 新增紀錄</button></header><div class="notice">目前為介面體驗版，資料僅保存在這個瀏覽器，尚未連線、登入或與家人同步。</div><section id="content"></section></main></div><dialog id="dialog"><form id="form"><div class="modal-head"><div><div class="eyebrow">ADD A MOMENT</div><h2>新增紀錄</h2></div><button type="button" class="close" id="close" aria-label="關閉">×</button></div><label>紀錄類型<select name="type" id="type"><option value="event">行程</option><option value="message">聊天</option><option value="expense">記帳</option><option value="diary">日記</option></select></label><label id="textLabel">內容<input name="text" required maxlength="200" placeholder="今天想記下什麼？"></label><label id="dateLabel">日期<input name="date" type="date"></label><label id="timeLabel">時間<input name="time" type="time"></label><label id="amountLabel">金額<input name="amount" type="number" min="1" step="1" placeholder="例如 1200"></label><label id="linkLabel">關聯行程（選填）<select name="eventId" id="eventSelect"><option value="">不關聯行程</option></select></label><button class="primary full">儲存紀錄</button></form></dialog><script src="app.js"></script></body></html>
